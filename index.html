
<html>
    <head>
        <title>Flask Web Application</title>
        <!--CSS -->
        <style>
                body{background-color: rgb(171, 255, 255); font-family: Arial, Helvetica, sans-serif; font-size: larger;} 
                thead tr {
                    background-color:cornflowerblue;
                    color:aliceblue;
                    font-weight: bold;
                }

                th, td {
                    padding: 12px 15px;
                }

                .row-gray {
                    background-color: azure;
                }

                .row-accent {
                    background-color:rgb(132, 242, 250);
                }

        </style>
    </head>
    <body>
        <p>Welcome to Flask App</p>
        <table border="1">
            <thead>
                <tr >
                    <th>No</th>
                    <th>Student Id</th>
                    <th>Name</th>
                </tr>
            </thead>
            {% for student in student_list %}
            <tr class="{{loop.cycle('row-gray','row-accent')}}" >
                <td>{{loop.index0}}</td>
                <td>{{student.id}}</td>
                <td>{{student.Name}}</td>
            </tr>
            {% endfor %}
        
        </table>
        <br>
        <table border="1">
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Mark</th>
                </tr>
            </thead>
            {% for student in examinationResult %}
            <tr class="{{loop.cycle('row-accent','row-gray')}}">
                <td>{{student.Name}}</td>
                <td>{{student.Mark}}</td>

            </tr>
            {% endfor %}
        
        </table>
    </body>
</html>
